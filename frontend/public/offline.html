<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b2416">
  <title>Sin conexión · Café de Altura</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8f1e5; color: #3b2416; padding: 24px; box-sizing: border-box; }
    .icono { font-size: 64px; }
    h1 { margin: 8px 0; }
    p { max-width: 420px; line-height: 1.5; color: #6b4c35; }
    button { margin-top: 16px; padding: 12px 24px; border: 0; border-radius: 999px; background: #3b2416; color: #fff; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="icono" aria-hidden="true">☕📡</div>
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar esta página. Revisa tu conexión a internet; en cuanto vuelva podrás seguir explorando el catálogo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
