<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Catálogo de cafés de especialidad. PWA con React (CSR), manifiesto y Service Worker para uso sin conexión." />
    <meta name="theme-color" content="#3b2416" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Café Altura" />
    <title>Café de Altura · Catálogo PWA</title>
    <!-- CSS crítico del App Shell: se pinta de inmediato, antes de que cargue JavaScript -->
    <style>
      body { margin: 0; background: #f8f1e5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .shell-header { background: #3b2416; color: #fff; height: 64px; display: flex; align-items: center; padding: 0 20px; font-weight: 700; font-size: 18px; }
      .shell-cargando { display: grid; place-items: center; height: 60vh; color: #6b4c35; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shell estático inicial: React lo reemplaza al montar (CSR) -->
      <header class="shell-header">☕ Café de Altura</header>
      <div class="shell-cargando">Cargando catálogo…</div>
    </div>
    <noscript>Esta aplicación necesita JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
